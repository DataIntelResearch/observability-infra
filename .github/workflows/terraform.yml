name: terraform

on:
  pull_request:
    paths: ["terraform/**", ".github/workflows/terraform.yml"]
  push:
    branches: [main]
    paths: ["terraform/**", ".github/workflows/terraform.yml"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for keyless auth to Google Cloud

concurrency:
  group: terraform # never two runs against the same state at once
  cancel-in-progress: false

env:
  TF_VAR_project_id: ${{ secrets.GCP_PROJECT_ID }}
  TF_IN_AUTOMATION: "true"
  APPLY: ${{ github.event_name != 'pull_request' }}

jobs:
  infra:
    runs-on: ubuntu-latest
    # environment: production   # optional: require approval before apply
    defaults:
      run:
        working-directory: terraform/infra
    steps:
      - uses: actions/checkout@v7
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SA_EMAIL }}
      - uses: hashicorp/setup-terraform@v4

      - run: terraform fmt -check -recursive
      - run: terraform init -input=false -backend-config="bucket=${TF_VAR_project_id}-tfstate"
      - run: terraform validate
      - run: terraform plan -input=false -out=tfplan
      - if: env.APPLY == 'true'
        run: terraform apply -input=false tfplan

  platform:
    needs: infra
    runs-on: ubuntu-latest
    # environment: production
    defaults:
      run:
        working-directory: terraform/platform
    steps:
      - uses: actions/checkout@v7
      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SA_EMAIL }}
      - uses: google-github-actions/setup-gcloud@v3
      - uses: hashicorp/setup-terraform@v4

      - run: terraform fmt -check -recursive
      - run: terraform init -input=false -backend-config="bucket=${TF_VAR_project_id}-tfstate"
      - run: terraform validate

      # The platform stack reads the cluster, so it can't plan until infra has been applied.
      # On a PR before the cluster exists, skip the plan instead of failing.
      - id: cluster
        run: |
          if gcloud container clusters describe obs --zone us-east1-b --project "$TF_VAR_project_id" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::warning::GKE cluster not found yet; skipping platform plan. It will run after infra is applied."
          fi

      - if: steps.cluster.outputs.exists == 'true'
        run: terraform plan -input=false -out=tfplan
      - if: steps.cluster.outputs.exists == 'true' && env.APPLY == 'true'
        run: terraform apply -input=false tfplan
